name: Publish verified Windows artifact

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful Windows release workflow run
        required: true
      tag:
        description: Existing release tag
        required: true

permissions:
  actions: read
  contents: write

concurrency:
  group: publish-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SOURCE_RUN: ${{ inputs.run_id }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify build, reconcile assets and publish
        shell: bash
        run: python3 -m scripts.publish_verified --run-id "$SOURCE_RUN" --tag "$RELEASE_TAG"
